[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evocomp"
version = "0.1.0"
description = "Evolutionary Compiler for Neural Architectures"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "EVOCOMP Team", email = "evocomp@example.com"}
]
license = {text = "MIT"}
keywords = ["evolutionary-algorithms", "neural-architecture", "distributed-systems", "formal-verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "z3-solver>=4.12.0",
    "redis>=4.5.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
distributed = [
    "nccl>=2.18.0",
    "mpi4py>=3.1.0",
]
gpu = [
    "cuda-python>=11.8.0",
    "nvidia-ml-py>=12.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/evocomp"
Documentation = "https://evocomp.readthedocs.io"
Repository = "https://github.com/your-org/evocomp.git"
Issues = "https://github.com/your-org/evocomp/issues"
Changelog = "https://github.com/your-org/evocomp/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["evocomp"]

[tool.setuptools.package-dir]
"evocomp" = "src/evocomp"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--durations=10",
    "--cov=evocomp",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "performance: performance tests",
    "distributed: distributed tests",
    "gpu: GPU tests",
    "slow: slow tests",
]
